  venture_news: "https://techcrunch.com/category/venture/"
  # 产业链独立信号源。official 可直接确认自身公告；media/community 只做发现。
  industry_feeds:
    - {name: "NVIDIA Blog", url: "https://blogs.nvidia.com/feed/", track: "infrastructure", country: "US", layer_hint: "upstream", authority: "official"}
    - {name: "AWS Machine Learning Blog", url: "https://aws.amazon.com/blogs/machine-learning/feed/", track: "infrastructure", country: "US", layer_hint: "upstream", authority: "official"}
    - {name: "Google Cloud AI", url: "https://cloudblog.withgoogle.com/products/ai-machine-learning/rss/", track: "infrastructure", country: "US", layer_hint: "midstream", authority: "official"}
    - {name: "Product Hunt", url: "https://www.producthunt.com/feed", track: "applications", country: "GLOBAL", layer_hint: "downstream", authority: "community", discovery_only: true}
    - {name: "Crunchbase News", url: "https://news.crunchbase.com/feed/", track: "capital", country: "GLOBAL", layer_hint: "downstream", authority: "media", discovery_only: true}
    - {name: "TechCrunch Venture RSS", url: "https://techcrunch.com/category/venture/feed/", track: "capital", country: "GLOBAL", layer_hint: "downstream", authority: "media", discovery_only: true}

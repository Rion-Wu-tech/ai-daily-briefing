interface:
  display_name: "AI Daily Briefing"
  short_description: "生成 AI Markdown 简报与可交互 HTML 阅读界面"
  default_prompt: "Use $daily-briefing to generate a source-linked AI briefing for my requested time window. Cover official model and product updates, the upstream-to-downstream industry chain, application adoption, funding and commercial events, and potentially viral stories. Use the editorial plan as a global event ledger so every story has exactly one linked news card in exactly one primary section. Keep story IDs internal, place useful linked news first, omit empty sections and redundant index views, and retain a derived section only when it adds standalone analysis or an actionable draft. Make every story understandable without opening its link by writing three source-supported Chinese blocks: 发生了什么, 关键细节 with at least two concrete facts, and 为什么重要; normally use 120–260 Chinese characters total, add 待确认 only when needed, and omit stories whose source material cannot support that depth. Put source and scores in secondary metadata. After uniqueness and depth validation, also render the final Markdown as a standalone interactive HTML reader and return links to both files."

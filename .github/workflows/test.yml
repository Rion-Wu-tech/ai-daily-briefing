name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall briefing.py briefing_store.py
      - run: python -m unittest discover -s tests
      - run: python briefing.py --dry-run --no-save > /tmp/daily-briefing.md
      - run: grep -q '^## 今日必须看' /tmp/daily-briefing.md
